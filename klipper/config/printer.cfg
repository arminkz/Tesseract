[include mainsail.cfg]
[include timelapse.cfg]

[mcu]
# Replace this line with your actual /dev/serial/by-id/ path from above
serial: /dev/serial/by-id/usb-Arduino__www.arduino.cc__0042_85830303339351B0D1B2-if00
baud: 250000

[printer]
kinematics: corexy
max_velocity: 100
max_accel: 1000
max_z_velocity: 5
max_z_accel: 50

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 32
rotation_distance: 40
endstop_pin: ^!PE5
position_endstop: 0
position_max: 285
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 32
rotation_distance: 40
endstop_pin: ^!PJ1
position_endstop: -30
position_min: -30
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5.0
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 32
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
#control: pid
#pid_kp = 15.277
#pid_ki = 0.548
#pid_kd = 106.558
min_temp: 0
max_temp: 260
min_extrude_temp: 190

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
#control: watermark
min_temp: 0
max_temp: 120

[fan]
pin: PH6

[bltouch]
sensor_pin: ^PD3      # Z-Min endstop header (White/Black wires)
control_pin: PB5      # Servo 1 header / D11 (Orange/Red/Brown wires)
x_offset: 0           # Measure the X distance from nozzle to probe (can be negative)
y_offset: 0          # Measure the Y distance from nozzle to probe (can be negative)
#z_offset: 0           # Keep this at 0 for now. You will calibrate it later.

[safe_z_home]
home_xy_position: 150, 150 # Adjust these to the exact center coordinates of your bed
speed: 50
z_hop: 10                  # Lift Z by 10mm before homing
z_hop_speed: 5

[force_move]
enable_force_move: True

[board_pins]
aliases:
    # Common EXP1 header found on many "all-in-one" ramps clones
    EXP1_1=PC0, EXP1_3=PH0, EXP1_5=PA1, EXP1_7=PA5, EXP1_9=<GND>,
    EXP1_2=PC2, EXP1_4=PH1, EXP1_6=PA3, EXP1_8=PA7, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB3, EXP2_3=PC6, EXP2_5=PC4, EXP2_7=PL0, EXP2_9=<GND>,
    EXP2_2=PB1, EXP2_4=PB0, EXP2_6=PB2, EXP2_8=PG0, EXP2_10=<RST>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "spi"
    # Note, some boards wire: EXP2_8=<RST>, EXP2_10=PG0

[display]
lcd_type: st7920
cs_pin: EXP1_4
sclk_pin: EXP1_5
sid_pin: EXP1_3
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
kill_pin: ^!EXP2_8

[output_pin beeper]
pin: EXP1_1
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

[gcode_macro PRINT_START]
gcode:
    # Fetch the temperatures passed from OrcaSlicer
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    # Set to absolute positioning
    G90
    
    # Home all axes
    G28
    
    # Heat the bed and wait
    M190 S{BED_TEMP}
    # Heat the nozzle and wait
    M109 S{EXTRUDER_TEMP}
    
    # Reset the extruder distance
    G92 E0

[gcode_macro PRINT_END]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    
    # Relative positioning
    G91
    # Retract filament slightly and move away from the print
    G1 E-2 X-2 Y-2 F3000
    # Raise nozzle by 5mm
    G1 Z5 F3000
    
    # Absolute positioning
    G90
    # Home X and Y
    G28 X Y
    
    # Disable steppers
    M84

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True 
variable_custom_park_x    : 0.0  
variable_custom_park_y    : -30.0  
gcode:

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0 / S }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

[screws_tilt_adjust]
screw1: 0, -30
screw1_name: Start X Start Y
screw2: 280, -30
screw2_name: End X Start Y
screw3: 280, 265
screw3_name: End X End Y
screw4: 0, 265
screw4_name: Start X End Y
horizontal_move_z: 10
speed: 50
screw_thread: CW-M3 # Change to CW-M3 if your printer uses M3 screws

[bed_screws]
screw1: 0, 0
screw1_name: Start X Start Y
screw2: 280, 0
screw2_name: End X Start Y
screw3: 280, 300
screw3_name: End X End Y
screw4:  0, 300
screw4_name: Start X End Y
horizontal_move_z: 10
probe_height: 0
speed: 50
probe_speed: 5

